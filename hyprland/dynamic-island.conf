# ==============================================================================
# Dynamic Island for Hyprland - Configuration & Keybindings
# Add the following line to ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/dynamic-island.conf
# ==============================================================================

# Autostart daemon
exec-once = dynamic-island

# Layer shell rules for Hyprland
# Disable Hyprland window/layer animations for dynamic-island so Cairo cubic easing runs pure 60fps
layerrule = no_anim on, match:namespace dynamic-island

# Workspace optimization: Keep workspaces 1-10 persistent to eliminate empty-workspace creation delay & animation stutter
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
workspace = 8, persistent:true
workspace = 9, persistent:true
workspace = 10, persistent:true

# Keybindings ($mainMod is typically SUPER)
$mainMod = SUPER

# Toggle Dynamic Island expand / collapse
bind = $mainMod, I, exec, dynamic-island toggle
bind = $mainMod, Escape, exec, dynamic-island collapse

# Module direct expand/toggle shortcuts (press to expand, press again to collapse)
bind = $mainMod, V, exec, dynamic-island expand audio
bind = $mainMod, M, exec, dynamic-island expand media
bind = $mainMod, S, exec, dynamic-island expand system
bind = $mainMod, C, exec, dynamic-island expand clock
bind = $mainMod, N, exec, dynamic-island expand network
bind = $mainMod SHIFT, D, exec, dynamic-island dark
bind = $mainMod SHIFT, N, exec, dynamic-island eye

# Screenshot triggers with Island visual feedback
bind = , Print, exec, dynamic-island screenshot full
bind = SHIFT, Print, exec, dynamic-island screenshot area

# Hardware Media Keys (Volume with Dynamic Island popup)
bindel = , XF86AudioRaiseVolume, exec, dynamic-island volume +5%
bindel = , XF86AudioLowerVolume, exec, dynamic-island volume -5%
bindel = , XF86AudioMute, exec, dynamic-island volume toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Hardware Brightness Keys (Brightness with Dynamic Island popup)
bindel = , XF86MonBrightnessUp, exec, dynamic-island brightness +5%
bindel = , XF86MonBrightnessDown, exec, dynamic-island brightness -5%

# Hardware Playback Keys
bindl = , XF86AudioPlay, exec, dynamic-island media play-pause
bindl = , XF86AudioPause, exec, dynamic-island media play-pause
bindl = , XF86AudioNext, exec, dynamic-island media next
bindl = , XF86AudioPrev, exec, dynamic-island media previous
